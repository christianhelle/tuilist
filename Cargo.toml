[package]
name = "tuilist"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A terminal client for Microsoft To Do, with vim-style keys"
license = "MIT"
readme = "README.md"
repository = "https://github.com/christianhelle/tuilist"
keywords = ["todo", "tasks", "microsoft-to-do", "tui", "terminal"]
categories = ["command-line-utilities"]
exclude = [".github/", ".gitattributes", "images/"]

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
fastrand = "2.5.0"
flate2 = "1.1.11"
html2text = { version = "0.17.4", features = ["css"] }
jiff = { version = "0.2.43", features = ["serde"] }
keyring = "4.2.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
self-replace = "1.5.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tempfile = "3.27.0"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures = "0.3.34"
insta = "1.49.0"
wiremock = "0.6.5"

