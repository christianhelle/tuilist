[package]
name = "tuilist"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal client for Microsoft To Do, with vim-style keys"
license = "MIT"
readme = "README.md"
repository = "https://github.com/christianhelle/tuilist"
keywords = ["todo", "tasks", "microsoft-to-do", "tui", "terminal"]
categories = ["command-line-utilities"]
exclude = [".github/", ".gitattributes", "images/"]

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.43", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
futures = "0.3.34"
